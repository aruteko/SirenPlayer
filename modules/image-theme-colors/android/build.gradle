plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

// BBPlayer (MIT, Copyright (c) 2025 Roitium) の image-theme-colors に基づく
group = 'expo.modules.imagethemecolors'
version = '0.3.0'

android {
    namespace "expo.modules.imagethemecolors"
    defaultConfig {
        versionCode 1
        versionName '0.3.0'
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation "androidx.palette:palette-ktx:1.0.0"
}
